name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 10:00 Asia/Shanghai (UTC+8)
    - cron: '17,37 2 * * *' # Retry missed/failed runs at 10:17 and 10:37

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout scheduler
        uses: actions/checkout@v6

      - name: Check for a successful digest today
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?status=success&per_page=100" > "$RUNNER_TEMP/digest-runs.json"
          else
            printf '{"workflow_runs": []}' > "$RUNNER_TEMP/digest-runs.json"
          fi
          python tools/daily_schedule_gate.py < "$RUNNER_TEMP/digest-runs.json"

  calculate-and-send:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
